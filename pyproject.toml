[project]
name = "agentic-solutions"
version = "0.1.0"
description = "Learning LangGraph by building agentic AI solutions with Claude"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=1.0",
    "langchain-anthropic>=0.3",
    "python-dotenv>=1.0",
    "sentence-transformers>=3",  # embeddings for the secure_chat_agent threat guard
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph-checkpoint-sqlite>=3.0",
    "aiosqlite>=0.20",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_solutions" = ["agents/*/explanation.md", "web/static/*"]
